[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minebot"
version = "0.1.0"
description = "扫雷机器人"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.12.0",
    "mss==10.2.0"
]

[project.scripts]
minebot = "minebot.app:main"

[tool.setuptools.packages.find]
where = ["src"]
